name: CI Quality Gate

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: 1

jobs:
  resolve-dagger-version:
    runs-on: [self-hosted, coolify]
    outputs:
      dagger_version: ${{ steps.resolve.outputs.dagger_version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Resolve Dagger Version
        id: resolve
        run: |
          set -euo pipefail
          ENGINE_VERSION="$(awk -F'"' '/"engineVersion"/{print $4; exit}' dagger.json)"
          if [ -z "${ENGINE_VERSION}" ]; then
            echo "engineVersion is missing in dagger.json"
            exit 1
          fi
          DAGGER_VERSION="${ENGINE_VERSION#v}"
          echo "dagger_version=${DAGGER_VERSION}" >> "$GITHUB_OUTPUT"

  check-quality:
    needs: resolve-dagger-version
    runs-on: >-
      ${{ fromJSON(format('["self-hosted","dagger:{0}"]', needs.resolve-dagger-version.outputs.dagger_version)) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Validate Dagger CLI Version
        env:
          DAGGER_VERSION: ${{ needs.resolve-dagger-version.outputs.dagger_version }}
        run: |
          set -euo pipefail
          hash -r
          which dagger
          ACTUAL_DAGGER_VERSION="$(dagger version | sed -n 's/.*v\([0-9][0-9.]*\).*/\1/p' | sed -n '1p')"
          if [ "${ACTUAL_DAGGER_VERSION}" != "${DAGGER_VERSION}" ]; then
            echo "Dagger CLI version mismatch: expected ${DAGGER_VERSION}, got ${ACTUAL_DAGGER_VERSION}"
            exit 1
          fi

      - name: Run Dagger CI
        run: |
          echo "Running full checks..."
          dagger call run-all-checks --src=.
